name: AI HOT All Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: aihot-all-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      AIHOT_SOURCE_MODE: all
      AIHOT_LOOKBACK_DAYS: "1"
      AIHOT_MAX_ITEMS: "20"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate GitHub Secrets
        run: |
          python - <<'PY'
          import os
          import sys

          required = ["NOTION_TOKEN", "NOTION_DATABASE_ID"]
          missing = [name for name in required if not os.environ.get(name)]

          if missing:
              print(
                  "Missing required GitHub Actions secrets: " + ", ".join(missing),
                  file=sys.stderr,
              )
              sys.exit(1)

          print("Required GitHub Actions secrets are configured.")
          PY

      - name: Generate AI HOT all-items page
        run: python ./sources/daily_paper.py

      - name: Sync to Notion
        run: python ./sync_to_notion.py

      - name: Trigger Vercel deploy
        if: ${{ success() && env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Vercel Deploy Hook triggered successfully."

      - name: Skip Vercel deploy when hook is missing
        if: ${{ success() && env.VERCEL_DEPLOY_HOOK_URL == '' }}
        run: echo "VERCEL_DEPLOY_HOOK_URL is not configured, skipping Vercel redeploy."
